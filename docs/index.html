<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122A4B">
  <title>Матрица квартирографии — ЭНКО</title>
  <link rel="icon" type="image/png" href="brand/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <img class="brand-mark" src="brand/mark.png" width="36" height="36" alt="">
        <img class="brand-wordmark" src="brand/wordmark.svg" alt="ЭНКО">
        <div class="brand-text">
          <h1>Матрица квартирографии</h1>
          <p>Загрузите планировки PDF. Агент Основная выгрузка — .xlsm.</p>
        </div>
      </div>
    </header>

    <main class="wrap layout">
      <section class="panel">
        <h2>Исходный файл</h2>
        <label class="drop" id="drop">
          <input id="file" type="file" accept=".pdf,.rvt,.dwg,.xlsx,.xlsm,application/pdf">
          <strong id="fileLabel">Выберите или перетащите файл</strong>
          <span>PDF планировок — основной путь. RVT без IFC не читается в браузере.</span>
        </label>
        <div class="row">
          <button type="button" class="ghost" id="btnDemo">Демо: К-2 Айвазовский</button>
        </div>
        <h2>Формат выгрузки</h2>
        <div class="seg" role="group">
          <button type="button" class="seg-btn" data-fmt="xlsx" id="fmtXlsx">.xlsx</button>
          <button type="button" class="seg-btn on" data-fmt="xlsm" id="fmtXlsm">.xlsm</button>
        </div>
        <p class="hint" id="fmtHint">xlsm — копия шаблона ГП-10: форматы ячеек, оформление и VBA.</p>
        <button type="button" class="primary" id="btnRun" disabled>Запустить агента</button>
      </section>

      <section class="panel">
        <h2>Ход процесса</h2>
        <ol class="steps" id="steps"></ol>
        <div class="bar"><i id="bar"></i></div>
        <p class="hint" id="status">Ожидание файла</p>
      </section>
    </main>

    <section class="wrap metrics" id="metricsBlock" hidden>
      <h2>Итоговые метрики</h2>
      <div class="stats" id="stats"></div>
      <div class="charts">
        <div>
          <h3>Квартиры по этажам</h3>
          <div id="floorBars" class="hbars"></div>
        </div>
        <div>
          <h3>Тип кухни</h3>
          <div id="kitBars" class="hbars"></div>
        </div>
      </div>
      <table class="grid" id="preview"></table>
      <div class="row end">
        <button type="button" class="primary" id="btnDl" hidden>Скачать матрицу</button>
      </div>
    </section>

    <footer class="wrap foot">
      <img class="foot-mark" src="brand/wordmark.svg" alt="ЭНКО">
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="engine.js"></script>
  <script src="fill.js"></script>
  <script src="app.js"></script>
</body>
</html>
